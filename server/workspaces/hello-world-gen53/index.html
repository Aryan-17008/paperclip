<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f23;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #e94560;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.5);
            animation: fadeIn 2s ease;
        }

        p {
            color: #a0a0a0;
            font-size: 1.2rem;
            margin-top: 10px;
            animation: fadeIn 2s ease 0.5s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World!</h1>
        <p>Welcome to my simple webpage</p>
    </div>
</body>
</html>
