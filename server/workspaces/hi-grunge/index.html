<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>hi — grunge</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #0f0f0f;
      font-family: 'Permanent Marker', cursive, sans-serif;
    }

    .grunge-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(139, 0, 0, 0.25), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(34, 34, 34, 0.9), transparent 50%),
        repeating-linear-gradient(45deg, #111 0, #111 2px, #0a0a0a 2px, #0a0a0a 4px);
      filter: contrast(1.2) brightness(0.9);
      z-index: 0;
    }

    .grunge-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.18'/%3E%3C/svg%3E");
      opacity: 0.35;
      mix-blend-mode: overlay;
      pointer-events: none;
    }

    .grunge-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-radial-gradient(
        circle at 50% 50%,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.03) 4px,
        transparent 5px
      );
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .hi-text {
      font-size: clamp(8rem, 28vw, 22rem);
      line-height: 0.85;
      color: #e8e0d5;
      text-transform: lowercase;
      letter-spacing: -0.06em;
      text-shadow:
        4px 4px 0 #5c1a1a,
        8px 8px 0 #1a1a1a,
        0 0 60px rgba(139, 0, 0, 0.5);
      transform: rotate(-3deg);
      position: relative;
      user-select: none;
    }

    .hi-text::after {
      content: 'hi';
      position: absolute;
      left: 6px;
      top: 6px;
      color: transparent;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.08);
      z-index: -1;
    }

    .scratch {
      position: absolute;
      width: 140%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      transform: rotate(-8deg);
      top: 52%;
      left: -20%;
      mix-blend-mode: overlay;
    }

    .scratch:nth-child(2) {
      top: 58%;
      transform: rotate(5deg);
      background: rgba(139, 0, 0, 0.35);
    }

    .subtitle {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 3vw, 1.6rem);
      color: #8a8a8a;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      opacity: 0.8;
      transform: rotate(-1deg);
    }

    .splatter {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 0, 0, 0.6), transparent 70%);
      filter: blur(8px);
      pointer-events: none;
      z-index: 0;
    }

    .splatter.one { width: 260px; height: 260px; top: 8%; left: -5%; }
    .splatter.two { width: 180px; height: 180px; bottom: 12%; right: -3%; background: radial-gradient(circle, rgba(80, 80, 80, 0.5), transparent 70%); }
    .splatter.three { width: 120px; height: 120px; top: 55%; right: 15%; background: radial-gradient(circle, rgba(139, 0, 0, 0.35), transparent 70%); }
  </style>
</head>
<body>
  <div class="grunge-bg"></div>
  <div class="splatter one"></div>
  <div class="splatter two"></div>
  <div class="splatter three"></div>

  <main class="container">
    <h1 class="hi-text">
      hi
      <span class="scratch"></span>
      <span class="scratch"></span>
    </h1>
    <p class="subtitle">raw. rough. real.</p>
  </main>
</body>
</html>
